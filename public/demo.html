<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arista · Live Demo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="back-link" title="Back to Demo Dashboard">←</a>
      <div class="header-divider"></div>
      <img src="assets/arista-com-logo.png" alt="Arista Networks" class="logo">
      <div class="header-divider"></div>
      <img src="assets/avd-logo.png" alt="AVD" class="logo-icon">
      <img src="assets/ci_pipeline.png" alt="CI Pipeline" class="logo-icon">
    </div>
    <div class="header-right">
      <div class="act-status hidden" id="act-status">
        <span class="header-cred-label">ACT Lab Status</span>
        <span class="act-status-dot" id="act-status-dot"></span>
        <span class="act-status-label" id="act-status-label"></span>
      </div>
      <div class="header-divider act-divider hidden" id="act-divider"></div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">
        <span class="theme-toggle-icon" id="theme-icon-sun">☀️</span>
        <span class="theme-toggle-icon hidden" id="theme-icon-moon">🌙</span>
        <span class="theme-toggle-label" id="theme-label">Light Mode</span>
      </button>
    </div>
  </header>

  <main class="dashboard" id="dashboard">
    <!-- Populated dynamically by app.js -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="js/github-panel.js"></script>
  <script src="js/cloudvision-panel.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
